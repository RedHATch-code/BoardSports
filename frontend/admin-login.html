<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login administrativo restrito da BoardSports.">
  <link rel="canonical" href="admin-login.html">
  <link rel="icon" type="image/png" href="assets/images/Logo_pap.png">
  <title>Login Admin - BoardSports</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/floating-dock.css">
  <link rel="stylesheet" href="css/rift-atlas.css">
</head>
<body class="site-dock-auth">

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="assets/images/Logo_pap.png" alt="BoardSports Logo" class="auth-logo-image" width="76" height="76" loading="eager">
      </div>
      <h1>Admin</h1>
      <p>Acesso restrito ao painel de moderação da BoardSports.</p>
    </div>

    <form id="admin-login-form" class="auth-form">
      <div class="form-group">
        <label for="admin-email">Administrador</label>
        <input
          id="admin-email"
          type="text"
          autocomplete="username"
          placeholder="admin"
          required
        >
      </div>

      <div class="form-group">
        <label for="admin-password">Palavra-passe da conta</label>
        <input
          id="admin-password"
          type="password"
          autocomplete="current-password"
          placeholder="12345"
          required
        >
      </div>

      <button type="submit" class="btn-primary" id="admin-login-btn">
        <span>Entrar como admin</span>
        <span class="btn-icon" aria-hidden="true">-></span>
      </button>

      <div id="admin-msg" class="auth-message"></div>
    </form>

    <div class="auth-footer">
      <p>Não és administrador</p>
      <a href="login.html" class="auth-link">Voltar ao login normal</a>
    </div>
  </div>

  <div class="auth-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
</div>

<script type="module" src="js/admin_login.js"></script>
<script src="js/responsive.js"></script>
<script type="module" src="js/site_header.js"></script>

</body>
</html>
