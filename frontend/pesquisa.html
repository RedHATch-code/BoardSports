<html lang="pt">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="/assets/images/Logo_pap.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/floating-dock.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/map-page.css">
  <link rel="stylesheet" href="css/rift-atlas.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pesquisa BoardSports - Spots, Vídeos e Riders">
  <meta property="og:description" content="Pesquisa global por spots, vídeos e utilizadores da comunidade BoardSports.">
  <meta property="og:image" content="https://riftboardsports.netlify.app/assets/images/boardsports-mix.jpg">
  <meta property="og:url" content="https://riftboardsports.netlify.app/pesquisa.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pesquisa BoardSports - Spots, Vídeos e Riders">

<body class="map-page">
<a class="skip-link" href="#main-content">Saltar para o conteúdo</a>
  <main id="main-content" class="map-page-shell">
    <section class="map-page-hero">
      <div class="map-page-copy">
        <span class="map-page-kicker">Pesquisa global</span>
        <h1>Pesquisar BoardSports.</h1>
        <p>Encontra spots, vídeos e riders num único fluxo.</p>
      </div>
    </section>

    <section class="map-toolbar">
      <label class="map-field">
        <span>Pesquisa</span>
        <input type="search" id="global-search-input" placeholder="Spot, modalidade, vídeo ou utilizador">
      </label>
      <button type="button" id="global-search-button" class="map-primary-button">Pesquisar</button>
    </section>

    <section class="spots-panel">
      <div class="map-section-head">
        <div>
          <h2>Resultados</h2>
          <p id="global-search-summary">Escreve pelo menos 2 caracteres.</p>
        </div>
      </div>
      <div id="global-search-results" class="spots-grid"></div>
    </section>
  </main>

  <script type="module" src="/env.js"></script>
  <script type="module" src="js/pesquisa_page.js"></script>
  <script src="js/responsive.js"></script>
  <script type="module" src="js/site_header.js"></script>
</body>
</html>
